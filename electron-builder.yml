appId: space.mineco.app
productName: mineco
copyright: Copyright © 2026 mineco

directories:
  output: release/${version}
  buildResources: build

# Auto-update feed. Configuring a provider makes electron-builder embed
# `app-update.yml` in the packaged resources (electron-updater reads it at
# runtime to know where to look) and emit the `latest*.yml` metadata next to the
# installers. We do NOT let electron-builder publish — CI builds with
# `--publish never` and the release workflow uploads artifacts via `gh release`
# — but the feed files still need to land on the GitHub Release for updates to
# resolve. The owner/repo are the canonical case of the GitHub repo.
publish:
  provider: github
  owner: Ariaszzzhc
  repo: Mineco

# Pack the app into app.asar, but keep the Claude Agent SDK unpacked. The SDK
# reads its own runtime assets from disk (sdk.mjs, manifest.json — the latter is
# how services/cli-binary.ts verifies the downloaded binary) and spawns a native
# subprocess, neither of which should go through asar path translation.
asar: true
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**

# CI builds without an Apple cert (CSC_IDENTITY_AUTO_DISCOVERY=false), so
# electron-builder skips macOS signing and would leave a BROKEN seal (only the
# linker's ad-hoc sig on the Mach-O, no _CodeSignature/CodeResources). codesign
# then fails "code has no resources but signature indicates they must be
# present" and Gatekeeper marks the quarantined app "damaged, move to Trash".
# This hook ad-hoc re-signs the .app after pack so the seal is valid. A
# downloaded app still needs notarization (or a user `xattr -dr
# com.apple.quarantine`) to open; ad-hoc only avoids the unrecoverable error.
afterPack: build/after-pack.cjs

# Production node_modules are bundled automatically; these add the build output
# and prune what must NOT ship.
files:
  - dist
  - dist-electron
  - package.json
  # The 8 prebuilt native CLI variants are ~235 MB each. mineco downloads the
  # host's variant on first session into ~/.mineco/.bin (services/cli-binary.ts),
  # so excluding them keeps the installer ~tens of MB instead of ~250 MB — and
  # dodges signing a 235 MB binary that's already Anthropic-signed in the user
  # dir. Keep the JS SDK (@anthropic-ai/claude-agent-sdk, no trailing variant).
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: mineco
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Installer/uninstaller icons default to build/icon.ico (generated from
  # build/icon.png). To brand the wizard further, add build/installerHeader.bmp
  # (150x57) and build/installerSidebar.bmp (164x314).
  # NOTE: no code signing configured — Windows SmartScreen will warn "unknown
  # publisher" until you add win.signtoolOptions (cert) or Azure Trusted Signing.

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # Squirrel.Mac (electron-updater's macOS backend) updates from a zipped app,
    # not the dmg — without a zip target the mac feed has no payload to download.
    # NOTE: macOS auto-update also requires a *signed* build; the unsigned CI
    # artifacts install fine but can't self-update until signing is configured.
    - target: zip
      arch: [arm64, x64]
  # No hardenedRuntime: it requires a real (Developer ID) signature + notarization
  # to mean anything, and pairing it with the skipped/ad-hoc signing above only
  # produces contradictory, broken bundles. Re-enable it together with Developer
  # ID signing when notarization is set up (see build/after-pack.cjs).

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64, arm64]
