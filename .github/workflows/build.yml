# Reusable build matrix. Builds installers for macOS / Windows / Linux and
# uploads them as per-OS artifacts. Called by nightly.yml and release.yml; never
# runs on its own. Publishing (creating GitHub releases) is the caller's job.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and build (default branch if empty).
        type: string
        required: false
      version:
        description: Stamp package.json to this version before building (optional).
        type: string
        required: false
      channel:
        description: >-
          Update channel to publish (default "latest"). Nightly passes
          "nightly" so electron-builder emits a `nightly.yml` feed instead of
          `latest.yml`, keeping nightly's rolling auto-update isolated from
          stable. The GitHub provider ignores the version tag for channel
          detection, so it MUST be set explicitly here.
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nightly stamps a date/sha version so installers are distinguishable and
      # the About card reflects the build. Releases skip this (package.json is
      # already at the tagged version).
      - name: Stamp version
        if: inputs.version != ''
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build installers
        shell: bash
        # `--publish never`: on a tag push electron-builder auto-publishes to
        # GitHub and fails without a token. Publishing is the caller's separate
        # `publish` job (via `gh release`), so electron-builder must only build.
        # (`pnpm dist` is `vite build && electron-builder`; spell it out so the
        # flag reaches electron-builder, not the whole script.)
        # `-c.publish.channel`: override the feed channel for this build (nightly
        # → `nightly.yml`); empty for stable, which keeps the default `latest`.
        run: |
          channel_arg=""
          if [ -n "${{ inputs.channel }}" ]; then
            channel_arg="-c.publish.channel=${{ inputs.channel }}"
          fi
          pnpm build && pnpm exec electron-builder --publish never $channel_arg
        env:
          # No Apple signing certs in CI — don't let electron-builder try the
          # local keychain. Produces an unsigned (notarization-free) build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Only ship the installers + autoupdate feeds. Match exactly one directory
      # level (`release/<version>/*`), NOT a recursive `**`: the real artifacts
      # all sit at `release/<version>/`, while the per-arch `*-unpacked/` and
      # NSIS build dirs one level deeper hold helper executables (`elevate.exe`,
      # `mineco.exe`). A recursive glob swept those in, and the two arches'
      # identically-named `elevate.exe` collided on upload (`gh release` keys
      # assets by basename → HTTP 422 "ReleaseAsset.name already exists").
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.dmg.blockmap
            release/*/*.exe
            release/*/*.exe.blockmap
            release/*/*.AppImage
            # macOS auto-update payload (Squirrel.Mac downloads the zip, not the dmg).
            release/*/*.zip
            release/*/*.zip.blockmap
            # Auto-update feed metadata: `latest*.yml` for stable, `nightly*.yml`
            # for the nightly channel (only one set exists per build).
            release/*/latest*.yml
            release/*/nightly*.yml
