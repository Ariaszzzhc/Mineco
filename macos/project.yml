name: Mineco
# SwiftUI thin client — NOT part of the Deno workspace (docs/technical-design.md §9.1).
# This file is the single source of truth for the Xcode project; regenerate with
# `xcodegen generate` (never hand-edit Mineco.xcodeproj).

options:
  bundleIdPrefix: com.mineco
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    GENERATE_INFOPLIST_FILE: NO

targets:
  Mineco:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Mineco
        excludes:
          - "Resources/README.md"
          - "Resources/mineco-core"
          - "Resources/claude"
    info:
      path: Mineco/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mineco
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: Mineco/Resources/Mineco.entitlements
      properties:
        # v1 runs unsandboxed: the agent reads/writes arbitrary project dirs and
        # spawns the bundled `claude` + `mineco-core` binaries (§2.2, §9.2).
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mineco.app
        PRODUCT_NAME: Mineco
        INFOPLIST_FILE: Mineco/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mineco/Resources/Mineco.entitlements
        CODE_SIGN_IDENTITY: "-"
        # The compiled core + native claude binaries land in Resources via
        # `deno task compile` + the extract step (§9.2). They are gitignored
        # and intentionally NOT declared as static build resources here so the
        # project builds cleanly before they exist — they are instead bundled by
        # the postCompileScript below (which no-ops when they are missing).
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Resources"
    postCompileScripts:
      - name: Bundle core binaries
        # Copy the compiled `mineco-core` (+ native `claude`, when present) into
        # the app bundle's Resources so "Bundled binary (release)" mode can spawn
        # them. Guarded on existence so a clean checkout still builds before
        # `deno task compile` has produced them. Always runs (no output deps).
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          for bin in mineco-core claude; do
            SRC="${SRCROOT}/Mineco/Resources/$bin"
            if [ -f "$SRC" ]; then
              echo "Bundling $bin → Resources/"
              ditto "$SRC" "$DEST/$bin"
              chmod +x "$DEST/$bin"
            else
              echo "warning: $bin not found at $SRC — skipping (run 'deno task compile' at repo root)"
            fi
          done
